# Banc d'essai : lance la version Windows (release « labo-pc ») sur un serveur, en mode démo avec 50 spectateurs
# simulés, joue plusieurs manches complètes et publie mesures + captures d'écran (release « labo »).
# Se lance à la demande, après une construction.
name: Banc d'essai

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Nombre de manches à jouer"
        default: "3"
      players:
        description: "Spectateurs simulés"
        default: "50"

permissions:
  contents: write

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Télécharger le jeu PC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download labo-pc -R ${{ github.repository }} -p SpinArena-Windows.zip
          Expand-Archive SpinArena-Windows.zip -DestinationPath game

      - name: Lancer le banc d'essai
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "lab"
          New-Item -ItemType Directory -Force $out | Out-Null
          $rounds = "${{ inputs.rounds }}"; if (-not $rounds) { $rounds = "3" }
          $players = "${{ inputs.players }}"; if (-not $players) { $players = "50" }
          $exe = Join-Path $env:GITHUB_WORKSPACE "game\SpinArena.exe"
          $argsList = @("-spinlab", "-labrounds", $rounds, "-labplayers", $players, "-labseconds", "1500", "-labout", "`"$out`"", "-screen-fullscreen", "0", "-screen-width", "1920", "-screen-height", "1080", "-logFile", "`"$out\player.log`"")
          $p = Start-Process -FilePath $exe -ArgumentList $argsList -PassThru
          if (-not $p.WaitForExit(1800000)) { Write-Host "Délai dépassé"; $p.Kill() }
          Get-ChildItem $out
          if (Test-Path "$out\journal.md") { Get-Content "$out\journal.md"; Get-Content "$out\journal.md" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          else { Get-Content "$out\player.log" -Tail 120 }

      - name: Publier les résultats (release « labo »)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path lab\* -DestinationPath labo.zip -Force
          gh release view labo -R ${{ github.repository }} 2>$null; if ($LASTEXITCODE -ne 0) { gh release create labo -R ${{ github.repository }} --prerelease --title "Banc d'essai" --notes "Résultats du banc d'essai automatique" }
          gh release upload labo labo.zip -R ${{ github.repository }} --clobber
